<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<title>Classes WIMS – Collège Rosa Parks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rouge:#e11d48; --rouge-clair:#ffe4e6; --rouge-fonce:#9f1239;
    --bleu:#1a73e8;  --bleu-clair:#e8f0fe;  --bleu-fonce:#1251a3;
    --violet:#7c3aed;
    --bg:#f6f7fb; --card:#ffffff; --texte:#1f2937; --gris:#6b7280; --border:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light only}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:var(--bg);
    color:var(--texte);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 40px;
  }
  .page{width:100%;max-width:680px}

  .header-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .badge-code{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    background:var(--rouge);color:#fff;
    padding:2px 12px;border-radius:999px;font-size:.95rem;
    letter-spacing:.5px;
  }
  .tache-label{
    font-weight:700;color:var(--gris);font-size:.95rem;
  }

  .progress-bar-wrap{
    height:8px;background:var(--border);border-radius:999px;overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar{
    height:100%;width:100%;
    background:linear-gradient(90deg,var(--rouge),var(--violet),var(--bleu));
    border-radius:999px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 24px 26px;
    box-shadow:0 4px 18px rgba(31,41,55,.06);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--rouge),var(--violet),var(--bleu));
  }

  h1{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:1.7rem;line-height:1.2;text-align:center;
    margin-bottom:8px;
  }
  .intro{
    text-align:center;color:var(--gris);font-size:1.02rem;
    margin-bottom:26px;
  }

  .liens{display:flex;flex-direction:column;gap:16px}

  .lien-classe{
    display:flex;align-items:center;gap:16px;
    text-decoration:none;color:var(--texte);
    border:2px solid var(--c);
    background:var(--c-clair);
    border-radius:14px;
    padding:18px 20px;
    transition:transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .lien-classe:hover,
  .lien-classe:focus-visible{
    background:var(--c);color:#fff;
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(31,41,55,.12);
    outline:none;
  }
  .lien-classe:hover .sous,
  .lien-classe:focus-visible .sous{color:rgba(255,255,255,.9)}
  .lien-classe:hover .pastille,
  .lien-classe:focus-visible .pastille{background:#fff;color:var(--c)}

  .pastille{
    flex:0 0 auto;
    width:52px;height:52px;border-radius:50%;
    background:var(--c);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.5rem;
    transition:background .15s ease,color .15s ease;
  }
  .texte{flex:1 1 auto;min-width:0}
  .nom{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:1.3rem;line-height:1.15;
  }
  .sous{font-size:.92rem;color:var(--gris);margin-top:2px;transition:color .15s ease}
  .fleche{flex:0 0 auto;font-size:1.5rem;font-weight:800}

  .polteau{--c:var(--rouge);--c-clair:var(--rouge-clair)}
  .khouani{--c:var(--bleu);--c-clair:var(--bleu-clair)}

  .pied{
    text-align:center;color:var(--gris);font-size:.85rem;margin-top:18px;
  }

  @media (max-width:480px){
    h1{font-size:1.45rem}
    .lien-classe{padding:14px 14px;gap:12px}
    .pastille{width:44px;height:44px;font-size:1.25rem}
    .nom{font-size:1.15rem}
  }
</style>
</head>
<body>
<div class="page">

  <div class="header-row">
    <span class="badge-code">WIMS</span>
    <span class="tache-label">Collège Rosa Parks · Mathématiques</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar"></div></div>

  <main class="card">
    <h1>🎓 Accéder à ma classe WIMS</h1>
    <p class="intro">Choisis la classe de ton professeur de mathématiques.</p>

    <div class="liens">
      <a class="lien-classe polteau" target="_blank" rel="noopener"
         href="https://wims.univ-amu.fr/wims/wims.cgi?&amp;+lang=fr&amp;+module=adm%2Fclass%2Fclasses&amp;+type=authparticipant&amp;+class=1866219&amp;+subclass=yes">
        <span class="pastille">P</span>
        <span class="texte">
          <span class="nom">Classe de M. POLTEAU</span>
          <span class="sous">Ouvrir la classe WIMS</span>
        </span>
        <span class="fleche" aria-hidden="true">→</span>
      </a>

      <a class="lien-classe khouani" target="_blank" rel="noopener"
         href="https://wims.univ-amu.fr/wims/wims.cgi?+lang=fr&amp;+module=adm%2Fclass%2Fclasses&amp;+type=authparticipant&amp;+class=7458330&amp;+subclass=yes">
        <span class="pastille">K</span>
        <span class="texte">
          <span class="nom">Classe de M. KHOUANI</span>
          <span class="sous">Ouvrir la classe WIMS</span>
        </span>
        <span class="fleche" aria-hidden="true">→</span>
      </a>
    </div>
  </main>

  <p class="pied">Les liens s'ouvrent dans un nouvel onglet.</p>
</div>
</body>
</html>
