<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<title>Classes WIMS – Collège Rosa Parks</title>
<style>
  *{box-sizing:border-box}
  html{color-scheme:light only}
  body{
    margin:0;
    padding:20px 16px 32px;
    background:#ffffff;
    font-family:sans-serif;
    color:#1f2937;
  }
  .page{max-width:680px;margin:0 auto}

  /* Bandeau de bienvenue (même style que l'accueil WIMS) */
  .accueil{
    background-color:#F3E8FF;
    border-left:4px solid #7E22CE;
    border-radius:8px;
    padding:16px;
    margin-bottom:40px;
  }
  .accueil .titre{margin:0 0 8px 0;font-size:18px;font-weight:700;color:#581C87}
  .accueil .texte{margin:0;font-size:14px;color:#6B21A8;line-height:1.5}

  /* Le titre de chaque professeur est le lien */
  .classe{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:40px;
    padding:22px 16px;
    background:#5B2D8E;
    color:#fff;
    font-size:20px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(91,45,142,.30);
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .classe:hover,
  .classe:focus-visible{
    background:#4A2275;
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(91,45,142,.40);
    outline:none;
  }
  .classe:active{transform:translateY(0)}
</style>
</head>
<body>
<div class="page">

  <div class="accueil">
    <p class="titre">Bienvenue sur WIMS !</p>
    <p class="texte">&#127979; Clique sur le nom de ton professeur de math&eacute;matiques pour acc&eacute;der &agrave; tes exercices.</p>
  </div>

  <a class="classe" target="_top"
     href="https://wims.univ-amu.fr/wims/wims.cgi?&amp;+lang=fr&amp;+module=adm%2Fclass%2Fclasses&amp;+type=authparticipant&amp;+class=1866219&amp;+subclass=yes">
    Classe de M. POLTEAU
  </a>

  <a class="classe" target="_top"
     href="https://wims.univ-amu.fr/wims/wims.cgi?+lang=fr&amp;+module=adm%2Fclass%2Fclasses&amp;+type=authparticipant&amp;+class=7458330&amp;+subclass=yes">
    Classe de M. KHOUANI
  </a>

</div>
</body>
</html>
